[package]
name = "digital-notes"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.27"
unicode-segmentation = "1.13"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
shell-words = "1"
